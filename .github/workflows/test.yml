name: Tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: "go.mod"
      # The unit tests run Terraform against an in-process fake Bitbucket API
      # (resource.UnitTest); acceptance tests need TF_ACC and a real workspace.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: go build ./...
      - run: go test ./... -timeout 10m
